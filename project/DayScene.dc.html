<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes ds_tw{0%,100%{opacity:.2;}50%{opacity:1;}}
@keyframes ds_glow{0%,100%{opacity:.28;transform:scale(1);}50%{opacity:.52;transform:scale(1.14);}}
@keyframes ds_bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
@keyframes ds_bobm{0%,100%{transform:translateY(0);}50%{transform:translateY(-2.4px);}}
@keyframes ds_breathe{0%,100%{opacity:.04;}50%{opacity:.13;}}
@keyframes ds_drift1{0%,100%{transform:translateX(-6px);}50%{transform:translateX(11px);}}
@keyframes ds_drift2{0%,100%{transform:translateX(9px);}50%{transform:translateX(-7px);}}
@keyframes ds_fly1{from{transform:translateX(-46px);}to{transform:translateX(252px);}}
@keyframes ds_fly2{from{transform:translateX(-78px);}to{transform:translateX(252px);}}
@keyframes ds_flap{0%,100%{transform:scaleY(1);}50%{transform:scaleY(.55);}}
</style>
</helmet>
<div style="width:100%;height:100%;display:block;overflow:hidden;">
<svg width="100%" height="100%" viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" style="display:block;">
<defs>
<linearGradient id="dsM-{{ uid }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9B0"/><stop offset=".55" stop-color="#FFBF7C"/><stop offset="1" stop-color="#FF9C72"/></linearGradient>
<linearGradient id="dsA-{{ uid }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A8DBFF"/><stop offset=".55" stop-color="#6FB7F2"/><stop offset="1" stop-color="#3F95E0"/></linearGradient>
<linearGradient id="dsE-{{ uid }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFCB73"/><stop offset=".38" stop-color="#FB8C6A"/><stop offset=".72" stop-color="#B5689A"/><stop offset="1" stop-color="#6E54A0"/></linearGradient>
<linearGradient id="dsN-{{ uid }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3E86"/><stop offset=".5" stop-color="#23254F"/><stop offset="1" stop-color="#101230"/></linearGradient>
<radialGradient id="dsSun-{{ uid }}" cx=".4" cy=".34" r=".8"><stop offset="0" stop-color="#FFFDF2"/><stop offset=".45" stop-color="#FFDD83"/><stop offset="1" stop-color="#F5A623"/></radialGradient>
<radialGradient id="dsMoon-{{ uid }}" cx=".38" cy=".34" r=".82"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E6EAF4"/><stop offset="1" stop-color="#C0C6DA"/></radialGradient>
</defs>

<rect width="200" height="250" fill="url(#dsM-{{ uid }})" style="opacity:{{ opM }};transition:opacity 1.8s ease;"/>
<rect width="200" height="250" fill="url(#dsA-{{ uid }})" style="opacity:{{ opA }};transition:opacity 1.8s ease;"/>
<rect width="200" height="250" fill="url(#dsE-{{ uid }})" style="opacity:{{ opE }};transition:opacity 1.8s ease;"/>
<rect width="200" height="250" fill="url(#dsN-{{ uid }})" style="opacity:{{ opN }};transition:opacity 1.8s ease;"/>

<ellipse cx="100" cy="14" rx="170" ry="96" fill="#ffffff" style="opacity:.06;animation:ds_breathe 9s ease-in-out infinite;"/>

<g style="opacity:{{ starOp }};transition:opacity 1.8s ease;" fill="#ffffff">
<circle cx="30" cy="46" r="1.5" style="animation:ds_tw 3.2s ease-in-out infinite;"/>
<circle cx="58" cy="30" r="1.1" style="animation:ds_tw 4.1s ease-in-out infinite;animation-delay:.6s;"/>
<circle cx="84" cy="54" r="1.3" style="animation:ds_tw 2.8s ease-in-out infinite;animation-delay:1.2s;"/>
<circle cx="46" cy="96" r="1" style="animation:ds_tw 3.6s ease-in-out infinite;animation-delay:.3s;"/>
<circle cx="104" cy="38" r="1.2" style="animation:ds_tw 4.4s ease-in-out infinite;animation-delay:1.8s;"/>
<circle cx="128" cy="60" r="1.4" style="animation:ds_tw 3s ease-in-out infinite;animation-delay:.9s;"/>
<circle cx="162" cy="42" r="1.5" style="animation:ds_tw 3.8s ease-in-out infinite;animation-delay:2.2s;"/>
<circle cx="182" cy="80" r="1.1" style="animation:ds_tw 2.6s ease-in-out infinite;animation-delay:1.5s;"/>
<circle cx="150" cy="104" r="1" style="animation:ds_tw 4s ease-in-out infinite;animation-delay:.4s;"/>
<circle cx="24" cy="128" r="1.2" style="animation:ds_tw 3.4s ease-in-out infinite;animation-delay:2s;"/>
<circle cx="72" cy="120" r=".9" style="animation:ds_tw 2.9s ease-in-out infinite;animation-delay:1.1s;"/>
<circle cx="112" cy="92" r="1.1" style="animation:ds_tw 3.7s ease-in-out infinite;animation-delay:.7s;"/>
<circle cx="190" cy="120" r="1" style="animation:ds_tw 3.1s ease-in-out infinite;animation-delay:1.9s;"/>
<circle cx="14" cy="70" r="1.2" style="animation:ds_tw 4.2s ease-in-out infinite;animation-delay:.5s;"/>
<path d="M150 26 l1.5 3.6 3.6 1.5 -3.6 1.5 -1.5 3.6 -1.5 -3.6 -3.6 -1.5 3.6 -1.5z" style="animation:ds_tw 4.6s ease-in-out infinite;animation-delay:1.3s;"/>
</g>

<g style="transform:{{ sunTf }};opacity:{{ sunOp }};transition:transform 1.8s cubic-bezier(.37,.0,.28,1), opacity 1.5s ease;">
<g style="animation:ds_bob 7s ease-in-out infinite;">
<circle cx="100" cy="120" r="44" fill="#FFE08A" style="transform-box:fill-box;transform-origin:center;animation:ds_glow 6s ease-in-out infinite;"/>
<circle cx="100" cy="120" r="30" fill="url(#dsSun-{{ uid }})"/>
<ellipse cx="91" cy="110" rx="10" ry="7" fill="#ffffff" opacity=".4"/>
</g>
</g>

<g style="transform:{{ moonTf }};opacity:{{ moonOp }};transition:transform 1.8s cubic-bezier(.37,.0,.28,1), opacity 1.5s ease;">
<g style="animation:ds_bobm 8s ease-in-out infinite;">
<circle cx="100" cy="118" r="40" fill="#ffffff" style="opacity:.12;transform-box:fill-box;transform-origin:center;animation:ds_glow 7s ease-in-out infinite;"/>
<circle cx="100" cy="118" r="28" fill="url(#dsMoon-{{ uid }})"/>
<circle cx="110" cy="110" r="6" fill="#cfd5e6" opacity=".5"/>
<circle cx="92" cy="128" r="4" fill="#cfd5e6" opacity=".45"/>
<circle cx="106" cy="130" r="3" fill="#cfd5e6" opacity=".4"/>
</g>
</g>

<rect x="0" y="176" width="200" height="74" fill="{{ horizonFill }}" style="transition:fill 1.8s ease;"/>

<g style="opacity:{{ cloudOp }};transition:opacity 1.8s ease;" fill="{{ cloudFill }}">
<g style="animation:ds_drift1 22s ease-in-out infinite;">
<ellipse cx="66" cy="116" rx="24" ry="12"/>
<ellipse cx="92" cy="110" rx="32" ry="17"/>
<ellipse cx="116" cy="118" rx="20" ry="11"/>
</g>
<g style="animation:ds_drift2 28s ease-in-out infinite;">
<ellipse cx="84" cy="180" rx="22" ry="11"/>
<ellipse cx="112" cy="186" rx="28" ry="14"/>
<ellipse cx="70" cy="186" rx="16" ry="9"/>
</g>
</g>

<g style="opacity:{{ birdOp }};transition:opacity 1.2s ease;" stroke="#5b4636" stroke-width="1.4" fill="none" stroke-linecap="round">
<g style="animation:ds_fly1 26s linear infinite;">
<g style="transform-box:fill-box;transform-origin:center;animation:ds_flap 1.6s ease-in-out infinite;">
<path d="M0 56 q5 -4.5 10 0 q5 -4.5 10 0"/>
</g>
</g>
<g style="animation:ds_fly2 33s linear infinite;">
<g style="transform-box:fill-box;transform-origin:center;animation:ds_flap 1.9s ease-in-out infinite;">
<path d="M40 42 q4 -3.5 8 0 q4 -3.5 8 0"/>
</g>
</g>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:230},&quot;part&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;morning&quot;,&quot;afternoon&quot;,&quot;evening&quot;,&quot;night&quot;],&quot;default&quot;:&quot;morning&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  uid = 'd' + Math.random().toString(36).slice(2, 7);

  renderVals() {
    const part = this.props.part || 'morning';
    const C = {
      morning:   { sun: '-26px,46px',  moon: '-8px,150px', sunOp: 1, moonOp: 0, star: 0, cloudOp: 1,   cloud: '#ffffff', bird: 0.8,  hz: 'rgba(255,180,120,.12)' },
      afternoon: { sun: '0px,-74px',   moon: '-8px,150px', sunOp: 1, moonOp: 0, star: 0, cloudOp: 1,   cloud: '#ffffff', bird: 0.75, hz: 'rgba(150,195,245,.10)' },
      evening:   { sun: '28px,46px',   moon: '-8px,150px', sunOp: 1, moonOp: 0, star: 0, cloudOp: 0.6, cloud: '#f3cdb0', bird: 0.2,  hz: 'rgba(255,110,55,.28)' },
      night:     { sun: '0px,150px',   moon: '8px,-72px',  sunOp: 0, moonOp: 1, star: 1, cloudOp: 0,   cloud: '#cdd6ea', bird: 0,    hz: 'rgba(8,10,34,.42)' },
    };
    const c = C[part] || C.morning;
    return {
      uid: this.uid,
      opM: part === 'morning' ? 1 : 0,
      opA: part === 'afternoon' ? 1 : 0,
      opE: part === 'evening' ? 1 : 0,
      opN: part === 'night' ? 1 : 0,
      sunTf: 'translate(' + c.sun + ')',
      moonTf: 'translate(' + c.moon + ')',
      sunOp: c.sunOp,
      moonOp: c.moonOp,
      starOp: c.star,
      cloudOp: c.cloudOp,
      cloudFill: c.cloud,
      birdOp: c.bird,
      horizonFill: c.hz,
    };
  }
}
</script>
</body>
</html>
