name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database:
    name: Migrations & RLS policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start
      # The privacy guarantee is a test, not a convention: this job fails if an
      # admin can ever read a member's reflection.
      - name: Run pgTAP tests
        run: supabase test db
      - name: Check migrations apply from scratch
        run: supabase db reset

      # The parity test needs both a database and the workspace, so it runs here
      # rather than in the unit job, where it would skip.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client/server streak parity
        env:
          ABIDE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @abide/domain test

      # Drives the sync contract over HTTP the way the app does, which the pgTAP
      # suite cannot: it calls the functions directly and never sees the wire.
      - name: Import content
        run: pnpm --filter @abide/content content:import
      - name: Offline sync end to end
        run: pnpm check:offline
      - name: Admin authoring and publishing
        run: pnpm check:admin
      # Runs the delete as an admin against a member's history — the cross-user
      # case a single-user test cannot see.
      - name: Content CRUD and delete protection
        run: pnpm check:content
      - name: Notification ladder, cap and broadcasts
        run: pnpm check:notifications
