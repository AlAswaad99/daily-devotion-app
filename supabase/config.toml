project_id = "temuagn"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["temuagn://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# The log-collection container is not needed locally and is flaky on Windows.
[analytics]
enabled = false

[functions.send-notifications]
# Invoked by pg_cron via pg_net, which sends the service-role key rather than a
# user JWT, so the gateway must not demand one.
verify_jwt = false
